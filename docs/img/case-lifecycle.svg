<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Case lifecycle in Groundwork, from seed to published or closed as noise, with the attribution gate" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
  <style>
    .st{fill:#0d1117;stroke:#30363d;stroke-width:1.4}.pub{stroke:#3fb950;stroke-width:2}.noise{stroke:#8b949e;stroke-dasharray:4 3}.gate{fill:#0d1117;stroke:#388bfd;stroke-width:2}
    .t{fill:#e6edf3;font-weight:600;font-size:13px}.s{fill:#8b949e}.e{stroke:#8b949e;stroke-width:1.5;fill:none;marker-end:url(#m2)}.l{fill:#8b949e;font-size:11px}.k{fill:#79c0ff}
    @media (prefers-color-scheme: light){.st,.gate{fill:#ffffff}.st{stroke:#d0d7de}.t{fill:#1f2328}.s{fill:#57606a}.l{fill:#57606a}.k{fill:#0550ae}}
  </style>
  <text class="t" x="20" y="28" font-size="15">what a case goes through (table "case", column status)</text>

  <rect class="st" x="20" y="60" width="150" height="70" rx="6"/><text class="t" x="32" y="82">seed</text><text class="s" x="32" y="100">table seed</text><text class="s" x="32" y="116">score, source_family</text>
  <rect class="st" x="214" y="60" width="150" height="70" rx="6"/><text class="t" x="226" y="82">auto-opened</text><text class="s" x="226" y="100">opened_by = auto</text><text class="s" x="226" y="116">evidence undecided</text>
  <rect class="st" x="408" y="60" width="150" height="70" rx="6"/><text class="t" x="420" y="82">triaging</text><text class="s" x="420" y="100">first label by you</text><text class="s" x="420" y="116">precision recomputed</text>
  <rect class="st" x="602" y="60" width="150" height="70" rx="6"/><text class="t" x="614" y="82">active</text><text class="s" x="614" y="100">links created</text><text class="s" x="614" y="116">sandbox results attached</text>
  <rect class="st pub" x="796" y="60" width="184" height="70" rx="6"/><text class="t" x="808" y="82">published</text><text class="s" x="808" y="100">published_url set</text><text class="s" x="808" y="116">feed_entry rows written</text>
  <rect class="st noise" x="214" y="180" width="150" height="70" rx="6"/><text class="t" x="226" y="202">closed-noise</text><text class="s" x="226" y="220">untouched too long</text><text class="s" x="226" y="236">evidence types lose precision</text>

  <path class="e" d="M170 95 H214"/><text class="l" x="172" y="86">2 families</text>
  <path class="e" d="M364 95 H408"/><text class="l" x="368" y="86">accept/reject</text>
  <path class="e" d="M558 95 H602"/>
  <path class="e" d="M752 95 H796"/><text class="l" x="754" y="86">you set it</text>
  <path class="e" d="M289 130 V180"/>

  <rect class="gate" x="408" y="180" width="572" height="96" rx="6"/>
  <text class="t" x="420" y="202">the attribution gate, enforced by the database</text>
  <text class="s" x="420" y="222"><tspan class="k">link.decided_by</tspan> must be the analyst for same_operator, controls, hosts, resolves, publishes</text>
  <text class="s" x="420" y="240">a same_operator or controls link needs at least one <tspan class="k">accepted</tspan> evidence row of <tspan class="k">operator</tspan> scope</text>
  <text class="s" x="420" y="258">kit-scope fingerprints can only ever say same_kit; the trigger refuses anything else and says why</text>
</svg>
